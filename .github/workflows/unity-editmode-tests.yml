name: Unity Tests

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-open-pr:
    name: Check Open PR For Feature Push
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/') }}
    runs-on: ubuntu-latest
    outputs:
      has_open_pr: ${{ steps.check.outputs.has_open_pr }}
    steps:
      - name: Check for open PR from branch
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`
            });

            const hasOpenPr = pulls.length > 0;
            core.setOutput('has_open_pr', hasOpenPr ? 'true' : 'false');
            core.info(`Branch ${branch} has open PR: ${hasOpenPr}`);

  unity-tests:
    name: Unity Tests (${{ matrix.testMode }})
    needs: detect-open-pr
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/feature/') || needs.detect-open-pr.outputs.has_open_pr != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Pre-pull Unity editor image with retries
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="unityci/editor:ubuntu-6000.3.6f1-linux-il2cpp-3"
          ATTEMPTS=5
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "Pull attempt $i/$ATTEMPTS for $IMAGE"
            if docker pull "$IMAGE"; then
              echo "Image pull succeeded."
              exit 0
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              SLEEP_SECONDS=$((i * 20))
              echo "Pull failed. Retrying in ${SLEEP_SECONDS}s..."
              sleep "$SLEEP_SECONDS"
            fi
          done
          echo "Failed to pull $IMAGE after $ATTEMPTS attempts."
          exit 1

      - name: Run Unity tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.6f1
          testMode: ${{ matrix.testMode }}
          checkName: ${{ matrix.testMode == 'editmode' && 'Edit Mode Test Results' || 'Play Mode Test Results' }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.testMode }}-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

      - name: Build diagnostics snapshot (failed runs only)
        if: ${{ always() && steps.tests.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/${{ matrix.testMode }}
          {
            echo "testMode=${{ matrix.testMode }}"
            echo "tests.outcome=${{ steps.tests.outcome }}"
            echo "artifactsPath=${{ steps.tests.outputs.artifactsPath }}"
            echo "--- artifacts tree ---"
            find "${{ steps.tests.outputs.artifactsPath }}" -maxdepth 8 -print || true
            echo "--- logs/results in workspace ---"
            find . -type f \( -iname "*.log" -o -iname "*results*.xml" -o -iname "TestResults.xml" \) | sort || true
          } > diagnostics/${{ matrix.testMode }}/test-diagnostics.txt

      - name: Upload failure diagnostics
        if: ${{ always() && steps.tests.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.testMode }}-failed-test-diagnostics
          path: |
            diagnostics/${{ matrix.testMode }}/**
            ${{ steps.tests.outputs.artifactsPath }}/**/*.log
            ${{ steps.tests.outputs.artifactsPath }}/**/*results*.xml
            **/TestResults.xml
          if-no-files-found: warn
