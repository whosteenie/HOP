name: Unity Tests

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:

jobs:
  unity-tests:
    name: Run ${{ matrix.testMode }} Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Pre-pull Unity editor image with retries
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="unityci/editor:ubuntu-6000.3.6f1-linux-il2cpp-3"
          ATTEMPTS=5
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "Pull attempt $i/$ATTEMPTS for $IMAGE"
            if docker pull "$IMAGE"; then
              echo "Image pull succeeded."
              exit 0
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              SLEEP_SECONDS=$((i * 20))
              echo "Pull failed. Retrying in ${SLEEP_SECONDS}s..."
              sleep "$SLEEP_SECONDS"
            fi
          done
          echo "Failed to pull $IMAGE after $ATTEMPTS attempts."
          exit 1

      - name: Run Unity tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.6f1
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.testMode }}-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
