name: Unity Coverage (Manual)

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Which test mode to run with coverage"
        required: true
        type: choice
        default: both
        options:
          - both
          - editmode
          - playmode

jobs:
  coverage-editmode:
    name: Coverage (editmode)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.inputs.test_mode == 'both' || github.event.inputs.test_mode == 'editmode' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-editmode-coverage-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-editmode-coverage-
            Library-${{ runner.os }}-

      - name: Run Unity tests with coverage
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.6f1
          testMode: editmode
          checkName: Edit Mode Test Results (Coverage)
          coverageOptions: generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+Assembly-CSharp,-Assembly-CSharp-Editor;dontClear
          artifactsPath: artifacts/editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-coverage-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

      - name: Inspect artifacts tree (editmode)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.tests.outputs.artifactsPath }}"
          echo "artifactsPath=$ROOT"
          if [ -d "$ROOT" ]; then
            find "$ROOT" -maxdepth 5 -type d | sort
          else
            echo "Artifacts path does not exist."
          fi

      - name: Find coverage files (editmode)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching workspace for coverage directories/files..."
          find . -type d \( -iname "CodeCoverage" -o -iname "Report" \) | sort || true
          find . -type f \( -iname "Summary.xml" -o -iname "index.html" -o -iname "ReportGeneratorOutput.xml" \) | grep -i "coverage\|CodeCoverage\|Report" | sort || true

      - name: Build diagnostics snapshot (editmode)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/editmode
          {
            echo "tests.outcome=${{ steps.tests.outcome }}"
            echo "artifactsPath=${{ steps.tests.outputs.artifactsPath }}"
            echo "--- artifacts tree ---"
            find "${{ steps.tests.outputs.artifactsPath }}" -maxdepth 6 -print || true
            echo "--- CodeCoverage tree ---"
            find CodeCoverage -maxdepth 8 -print || true
            echo "--- coverage-ish files ---"
            find . -type f \( -iname "*.log" -o -iname "*results*.xml" -o -iname "Summary.xml" -o -iname "Summary.md" -o -iname "Summary.json" \) | sort || true
          } > diagnostics/editmode/coverage-diagnostics.txt

      - name: Upload diagnostics (editmode)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-coverage-diagnostics
          path: |
            diagnostics/editmode/**
            ${{ steps.tests.outputs.artifactsPath }}/**/*.log
            ${{ steps.tests.outputs.artifactsPath }}/**/*results*.xml
            CodeCoverage/**/*.log
          if-no-files-found: warn

      - name: Validate coverage report output (editmode)
        id: locate_coverage
        if: ${{ steps.tests.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY=""
          if [ -d "CodeCoverage" ]; then
            SUMMARY="$(find CodeCoverage -type f -name 'Summary.xml' | sort | head -n 1 || true)"
          fi
          if [ -n "$SUMMARY" ] && [ -f "$SUMMARY" ]; then
            REPORT_DIR="$(dirname "$SUMMARY")"
            INDEX="$REPORT_DIR/index.html"
            echo "report_dir=$REPORT_DIR" >> "$GITHUB_OUTPUT"
            echo "::notice title=Coverage generated (editmode)::Found $SUMMARY"
            {
              echo "### EditMode coverage output"
              echo "- Status: Found"
              echo "- Summary: \`$SUMMARY\`"
              echo "- Report Dir: \`$REPORT_DIR\`"
              if [ -f "$INDEX" ]; then
                echo "- HTML: \`$INDEX\`"
              else
                echo "- HTML: missing (summary still available)"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Coverage report missing (editmode)::No Summary.xml found under CodeCoverage."
            echo "::error title=Action needed::Coverage report did not generate. Check 'Run Unity tests with coverage' for coverage filter/options messages."
            echo "Coverage directory snapshot:"
            find CodeCoverage -maxdepth 5 -print || true
            {
              echo "### EditMode coverage output"
              echo "- Status: Missing"
              echo "- Expected: at least one \`CodeCoverage/**/Summary.xml\`"
              echo "- Next step: inspect \`Run Unity tests with coverage\` logs for coverage options/filter issues"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload coverage artifacts
        if: ${{ steps.tests.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: editmode-coverage-report
          path: ${{ steps.locate_coverage.outputs.report_dir }}/**
          if-no-files-found: error

  coverage-playmode:
    name: Coverage (playmode)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.inputs.test_mode == 'both' || github.event.inputs.test_mode == 'playmode' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-playmode-coverage-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-playmode-coverage-
            Library-${{ runner.os }}-

      - name: Run Unity tests with coverage
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.6f1
          testMode: playmode
          checkName: Play Mode Test Results (Coverage)
          coverageOptions: generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+Assembly-CSharp,-Assembly-CSharp-Editor;dontClear
          artifactsPath: artifacts/playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playmode-coverage-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

      - name: Inspect artifacts tree (playmode)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.tests.outputs.artifactsPath }}"
          echo "artifactsPath=$ROOT"
          if [ -d "$ROOT" ]; then
            find "$ROOT" -maxdepth 5 -type d | sort
          else
            echo "Artifacts path does not exist."
          fi

      - name: Find coverage files (playmode)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching workspace for coverage directories/files..."
          find . -type d \( -iname "CodeCoverage" -o -iname "Report" \) | sort || true
          find . -type f \( -iname "Summary.xml" -o -iname "index.html" -o -iname "ReportGeneratorOutput.xml" \) | grep -i "coverage\|CodeCoverage\|Report" | sort || true

      - name: Build diagnostics snapshot (playmode)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/playmode
          {
            echo "tests.outcome=${{ steps.tests.outcome }}"
            echo "artifactsPath=${{ steps.tests.outputs.artifactsPath }}"
            echo "--- artifacts tree ---"
            find "${{ steps.tests.outputs.artifactsPath }}" -maxdepth 6 -print || true
            echo "--- CodeCoverage tree ---"
            find CodeCoverage -maxdepth 8 -print || true
            echo "--- coverage-ish files ---"
            find . -type f \( -iname "*.log" -o -iname "*results*.xml" -o -iname "Summary.xml" -o -iname "Summary.md" -o -iname "Summary.json" \) | sort || true
          } > diagnostics/playmode/coverage-diagnostics.txt

      - name: Upload diagnostics (playmode)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playmode-coverage-diagnostics
          path: |
            diagnostics/playmode/**
            ${{ steps.tests.outputs.artifactsPath }}/**/*.log
            ${{ steps.tests.outputs.artifactsPath }}/**/*results*.xml
            CodeCoverage/**/*.log
          if-no-files-found: warn

      - name: Validate coverage report output (playmode)
        id: locate_coverage
        if: ${{ steps.tests.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY=""
          if [ -d "CodeCoverage" ]; then
            SUMMARY="$(find CodeCoverage -type f -name 'Summary.xml' | sort | head -n 1 || true)"
          fi
          if [ -n "$SUMMARY" ] && [ -f "$SUMMARY" ]; then
            REPORT_DIR="$(dirname "$SUMMARY")"
            INDEX="$REPORT_DIR/index.html"
            echo "report_dir=$REPORT_DIR" >> "$GITHUB_OUTPUT"
            echo "::notice title=Coverage generated (playmode)::Found $SUMMARY"
            {
              echo "### PlayMode coverage output"
              echo "- Status: Found"
              echo "- Summary: \`$SUMMARY\`"
              echo "- Report Dir: \`$REPORT_DIR\`"
              if [ -f "$INDEX" ]; then
                echo "- HTML: \`$INDEX\`"
              else
                echo "- HTML: missing (summary still available)"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Coverage report missing (playmode)::No Summary.xml found under CodeCoverage."
            echo "::error title=Action needed::Coverage report did not generate. Check 'Run Unity tests with coverage' for coverage filter/options messages."
            echo "Coverage directory snapshot:"
            find CodeCoverage -maxdepth 5 -print || true
            {
              echo "### PlayMode coverage output"
              echo "- Status: Missing"
              echo "- Expected: at least one \`CodeCoverage/**/Summary.xml\`"
              echo "- Next step: inspect \`Run Unity tests with coverage\` logs for coverage options/filter issues"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload coverage artifacts
        if: ${{ steps.tests.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playmode-coverage-report
          path: ${{ steps.locate_coverage.outputs.report_dir }}/**
          if-no-files-found: error

  coverage-bundle:
    name: Bundle Coverage Reports
    runs-on: ubuntu-latest
    needs:
      - coverage-editmode
      - coverage-playmode
    if: ${{ always() }}

    steps:
      - name: Download editmode report artifact
        if: ${{ (github.event.inputs.test_mode == 'both' || github.event.inputs.test_mode == 'editmode') && needs.coverage-editmode.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: editmode-coverage-report
          path: _download/editmode

      - name: Download playmode report artifact
        if: ${{ (github.event.inputs.test_mode == 'both' || github.event.inputs.test_mode == 'playmode') && needs.coverage-playmode.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: playmode-coverage-report
          path: _download/playmode

      - name: Build combined coverage zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage_bundle

          if [ -d "_download/editmode" ] && [ -n "$(find _download/editmode -type f -print -quit)" ]; then
            mkdir -p coverage_bundle/edit_Report
            cp -R _download/editmode/. coverage_bundle/edit_Report/
          fi

          if [ -d "_download/playmode" ] && [ -n "$(find _download/playmode -type f -print -quit)" ]; then
            mkdir -p coverage_bundle/play_Report
            cp -R _download/playmode/. coverage_bundle/play_Report/
          fi

          if [ ! -d "coverage_bundle/edit_Report" ] && [ ! -d "coverage_bundle/play_Report" ]; then
            echo "::error title=Coverage bundle failed::No edit/play coverage reports were found to bundle."
            exit 1
          fi

          zip -r coverage-reports.zip coverage_bundle
          echo "::notice title=Coverage bundle created::coverage-reports.zip"

      - name: Upload combined coverage zip
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-bundle
          path: coverage-reports.zip
          if-no-files-found: error
