behaviors:
  HopMovement:
    trainer_type: ppo
    
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0001
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 384
      num_layers: 2
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 0.08  # Increased from 0.05 - give survival/movement rewards more influence
      gail:
        strength: 0.8   # Reduced from 1.0 - balance with extrinsic for movement quality
        gamma: 0.99
        demo_path: Assets/Demonstrations/HOPMovementv1.demo
        use_actions: true
        use_vail: true
    
    # BC removed - it averages alternating patterns (air strafe) to zero, preventing learning
    
    keep_checkpoints: 80
    max_steps: 3000000
    time_horizon: 256  # Increased from 128 - more temporal context for movement chains
    summary_freq: 10000
    checkpoint_interval: 50000